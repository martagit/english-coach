[project]
name = "english-coach"
version = "0.1.0"
description = "Turns your Claude Code prompts into a daily English-coaching Obsidian vault."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
    "tzlocal>=5.0",
]

[project.scripts]
english-coach = "english_coach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["english_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches the real OS scheduler (opt-in via EC_SCHEDULER_IT=1)",
    "slow: builds the wheel",
]
